version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: evolutto-postgres
    restart: always
    environment:
      POSTGRES_DB: evolutto_db
      POSTGRES_USER: evolutto
      POSTGRES_PASSWORD: evolutto_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolutto-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
