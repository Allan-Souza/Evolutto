server:
  port: 8080

spring:
  application:
    name: evolutto-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/evolutto_db
    username: evolutto
    password: evolutto_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    # 256-bit secret key (32 characters / 64 hex characters) para assinatura HmacSHA256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
    # Expiração do Token in millis (24 horas = 86400000)
    expiration: 86400000
  cors:
    allowed-origins: "http://localhost:4200"
