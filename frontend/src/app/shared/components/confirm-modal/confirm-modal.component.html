<div class="modal-overlay" (click)="cancel.emit()">
  <div class="modal-content glass-panel" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h2 class="warning-title">{{ title }}</h2>
      <button class="btn-close" (click)="cancel.emit()">✕</button>
    </div>

    <div class="modal-body">
      <p>{{ message }}</p>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-secondary" (click)="cancel.emit()">{{ cancelText }}</button>
      <button type="button" class="btn-danger" (click)="confirm.emit()">{{ confirmText }}</button>
    </div>

  </div>
</div>
