<div class="app-layout">
  
  <div class="app-container">
  
  <!-- Top Header (Stats) -->
  <header class="app-header glass-panel" *ngIf="authService.isAuthenticated()">
    <div class="user-stats">
      <div class="stat-item level-badge">
        <span class="label">Lvl</span>
        <span class="value">{{ userStore.currentLevel() }}</span>
      </div>
      
      <div class="stat-item xp-bar-container">
        <div class="xp-text">
          <span>XP</span>
          <span class="xp-value">{{ userStore.currentXp() }} / {{ userStore.xpToNextLevel() + userStore.currentXp() }}</span>
        </div>
        <div class="xp-bar-bg">
          <!-- O estilo inline de width garante a reatividade do sinal no Angular -->
          <div class="xp-bar-fill" [style.width.%]="(userStore.currentXp() / (userStore.xpToNextLevel() + userStore.currentXp())) * 100"></div>
        </div>
      </div>

      <div class="stat-item coins-badge">
        <span class="coin-icon"><ng-icon name="lucideCoins"></ng-icon></span>
        <span class="value">{{ userStore.currentCoins() }}</span>
      </div>
    </div>
    
    <div *ngIf="userStore.isDebuffed()" class="debuff-warning">
      ⚠️ Penalidade ativa: -50% XP (Restam {{ userStore.debuffCounter() }} hábitos)
    </div>
  </header>

  <!-- Main Content Route -->
  <main class="content-area" [class.no-auth]="!authService.isAuthenticated()">
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav glass-panel" *ngIf="authService.isAuthenticated()">
    <a routerLink="/habits" routerLinkActive="active-link" class="nav-item">
      <span class="icon"><ng-icon name="lucideListTodo"></ng-icon></span>
      <span>Hábitos</span>
    </a>
    <a routerLink="/shop" routerLinkActive="active-link" class="nav-item">
      <span class="icon"><ng-icon name="lucideShoppingBag"></ng-icon></span>
      <span>Lojinha</span>
    </a>
    <a routerLink="/social" routerLinkActive="active-link" class="nav-item">
      <span class="icon"><ng-icon name="lucideTrophy"></ng-icon></span>
      <span>Social</span>
    </a>
    <a routerLink="/parental" routerLinkActive="active-link" class="nav-item">
      <span class="icon"><ng-icon name="lucideShield"></ng-icon></span>
      <span>Guardião</span>
    </a>
  </nav>
  
  <app-toast></app-toast>
  <app-level-up-modal 
    [show]="showLevelUpModal" 
    [newLevel]="newLevel" 
    (closeEvent)="closeModal()">
  </app-level-up-modal>

</div>
