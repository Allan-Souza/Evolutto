<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content glass-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ editData ? 'Editar Missão' : 'Nova Missão' }}</h2>
      <button type="button" class="btn-close" (click)="onClose()">✕</button>
    </div>

    <form [formGroup]="missionForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Título da Missão *</label>
        <input type="text" id="title" formControlName="title" placeholder="Ex: Hidratação em Dia" autocomplete="off" />
        <div class="error-msg" *ngIf="missionForm.get('title')?.invalid && missionForm.get('title')?.touched">
          Título é obrigatório.
        </div>
      </div>

      <div class="form-group">
        <label for="description">Descrição (Opcional)</label>
        <input type="text" id="description" formControlName="description" placeholder="Ex: Beba 2L de água por 3 dias" autocomplete="off" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="type">Período *</label>
          <select id="type" formControlName="type">
            <option [value]="MissionType.DAILY">Diária</option>
            <option [value]="MissionType.WEEKLY">Semanal</option>
            <option [value]="MissionType.MONTHLY">Mensal</option>
          </select>
        </div>

        <div class="form-group">
          <label for="totalSteps">Meta (Repetições) *</label>
          <input type="number" id="totalSteps" formControlName="totalSteps" min="1" placeholder="3" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="xpReward">Recompensa XP *</label>
          <input type="number" id="xpReward" formControlName="xpReward" min="1" placeholder="100" />
        </div>

        <div class="form-group">
          <label for="coinReward">Moedas 🪙 *</label>
          <input type="number" id="coinReward" formControlName="coinReward" min="0" placeholder="50" />
        </div>
      </div>

      <div class="form-group" *ngIf="availableHabits.length > 0">
        <label>Hábitos Vinculados</label>
        <p class="helper-text">
          Selecione hábitos específicos ou deixe em "Qualquer hábito bom" para progredir com qualquer conclusão.
        </p>
        <div class="habit-chips">
          <button
            type="button"
            class="habit-chip"
            [class.active]="selectedHabitIds.length === 0"
            (click)="clearHabitSelection()">
            ✨ Qualquer hábito bom
          </button>
          <button
            type="button"
            class="habit-chip"
            *ngFor="let habit of availableHabits"
            [class.active]="isHabitSelected(habit.id)"
            (click)="toggleHabit(habit.id)">
            {{ habit.title }}
          </button>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="missionForm.invalid">
          {{ editData ? 'Salvar Alterações' : 'Criar Missão' }}
        </button>
      </div>
    </form>
  </div>
</div>
