<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content glass-panel" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h2>Nova Recompensa</h2>
      <button class="btn-close" (click)="onClose()">✕</button>
    </div>

    <form [formGroup]="rewardForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="title">Nome da Recompensa *</label>
        <input type="text" id="title" formControlName="title" placeholder="Ex: Hora de Videogame" autocomplete="off" />
        <div class="error-msg" *ngIf="rewardForm.get('title')?.invalid && rewardForm.get('title')?.touched">
          Nome é obrigatório.
        </div>
      </div>

      <div class="form-group">
        <label for="cost">Custo (Moedas) *</label>
        <input type="number" id="cost" formControlName="cost" min="1" placeholder="100" />
        <div class="error-msg" *ngIf="rewardForm.get('cost')?.invalid && rewardForm.get('cost')?.touched">
          O custo deve ser maior que zero.
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="rewardForm.invalid">Criar Recompensa</button>
      </div>

    </form>
  </div>
</div>
