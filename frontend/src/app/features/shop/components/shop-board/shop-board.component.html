<div class="shop-board-container">
  <div class="header-actions">
    <h2>Lojinha</h2>
    <button class="btn-primary btn-sm" (click)="openModal()">+ Novo</button>
  </div>
  
  <div *ngIf="userStore.isDebuffed()" class="frozen-warning glass-panel">
    <ng-icon name="lucideSnowflake"></ng-icon> Sua Lojinha está congelada pelos seus pais. Cumpra uma missão de redenção para liberar!
  </div>

  <app-reward-form-modal
    *ngIf="showModal"
    [editData]="rewardToEdit"
    (closeEvent)="closeModal()"
    (saveEvent)="onSaveReward($event)">
  </app-reward-form-modal>

  <div class="rewards-wrapper" [class.frozen]="userStore.isDebuffed()" *ngIf="rewards.length > 0; else noRewards">
    <app-reward-card 
      *ngFor="let reward of rewards" 
      [reward]="reward" 
      [canAfford]="userStore.currentCoins() >= reward.cost"
      [isLoading]="loadingId === reward.id"
      (buy)="onBuy($event)"
      (edit)="openModal($event)"
      (delete)="onDeleteReward($event)">
    </app-reward-card>
  </div>
  
  <ng-template #noRewards>
    <div class="empty-state glass-panel animate-slide-up">
      <p>Nenhuma recompensa cadastrada. Crie uma nova para se motivar!</p>
    </div>
  </ng-template>

  <app-confirm-modal
    *ngIf="showConfirmModal"
    title="Excluir Recompensa"
    message="Tem certeza que deseja excluir esta recompensa permanentemente?"
    confirmText="Excluir"
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()">
  </app-confirm-modal>
</div>
