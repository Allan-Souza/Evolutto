<div class="modal-overlay" *ngIf="show">
  <div class="modal-content glass-panel animate-slide-up">
    <div class="modal-header">
      <h2>Nova Recompensa</h2>
    </div>
    
    <div class="form-group">
      <label>Título da Recompensa</label>
      <input type="text" class="rpg-input" [(ngModel)]="request.title" placeholder="Ex: Cinema com a mãe" />
    </div>

    <div class="form-group">
      <label>Custo (Moedas 🪙)</label>
      <input type="number" class="rpg-input" [(ngModel)]="request.cost" placeholder="Ex: 100" />
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" (click)="onClose()">Cancelar</button>
      <button class="btn-primary" (click)="onSave()" [disabled]="!request.title || !request.cost">Adicionar à Loja</button>
    </div>
  </div>
</div>
