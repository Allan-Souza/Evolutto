<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content glass-panel" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h2>Novo Hábito</h2>
      <button class="btn-close" (click)="onClose()">✕</button>
    </div>

    <form [formGroup]="habitForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="title">Título do Hábito *</label>
        <input type="text" id="title" formControlName="title" placeholder="Ex: Ler 10 páginas" autocomplete="off" />
        <div class="error-msg" *ngIf="habitForm.get('title')?.invalid && habitForm.get('title')?.touched">
          Título é obrigatório.
        </div>
      </div>

      <div class="form-group">
        <label for="description">Descrição</label>
        <input type="text" id="description" formControlName="description" placeholder="Detalhes opcionais" autocomplete="off" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="type">Tipo</label>
          <select id="type" formControlName="type">
            <option [value]="type" *ngFor="let type of habitTypes">
              {{ type === 'GOOD' ? 'Bom (+XP)' : 'Ruim (Debuff)' }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="difficulty">Dificuldade</label>
          <select id="difficulty" formControlName="difficulty">
            <option [value]="diff" *ngFor="let diff of habitDifficulties">
              {{ diff }}
            </option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="habitForm.invalid">Criar Hábito</button>
      </div>

    </form>
  </div>
</div>
